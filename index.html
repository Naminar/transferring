<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR File Transfer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f0f;
    color: #e4e4e7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #1a1a2e;
    border: 1px solid #27272a;
    border-radius: 16px;
    padding: 36px 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 { font-size: 24px; font-weight: 600; }
  h1 span { color: #22c55e; }
  p { font-size: 14px; color: #a1a1aa; line-height: 1.5; }
  .btn-group { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: block;
    text-decoration: none;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    transition: 0.2s;
  }
  .btn-primary {
    background: #166534;
    color: #22c55e;
    border: 1px solid #22c55e;
  }
  .btn-primary:hover { background: #1a7a42; color: #fff; }
  .btn-secondary {
    background: #1e293b;
    color: #38bdf8;
    border: 1px solid #38bdf8;
  }
  .btn-secondary:hover { background: #0284c7; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <h1><span>⚡</span> QR File Transfer</h1>
  <p>Air-gapped, offline file transfer between screens and cameras using animated high-density QR streams.</p>
  <div class="btn-group">
    <a href="generator.html" class="btn btn-primary">📁 Open Generator</a>
    <a href="scanner.html" class="btn btn-secondary">📷 Open Scanner</a>
  </div>
</div>
</body>
</html>
